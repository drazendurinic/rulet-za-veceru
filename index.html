<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff4dd"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Rulet za večeru</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#493426;background:#fff4dd}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 18%,#fffdf5,#fff0d3 70%);overflow-x:hidden}.app{width:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));gap:clamp(8px,1.5vh,16px)}h1{font-size:clamp(25px,5.8vw,42px);margin:0;text-align:center;line-height:1.15}.sub{font-size:clamp(13px,3.3vw,18px);margin:0;color:#8c654b;text-align:center}.wheel-wrap{width:min(96vw,67dvh,700px);height:min(96vw,67dvh,700px);position:relative;flex-shrink:0}.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 8px #9b64384a);will-change:transform}.pointer{position:absolute;left:50%;top:-9px;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 3px 2px #6d382f55);width:0;height:0;border-left:clamp(13px,3vw,22px) solid transparent;border-right:clamp(13px,3vw,22px) solid transparent;border-top:clamp(26px,6vw,42px) solid #e84c4c}.result{font-size:clamp(19px,5vw,31px);font-weight:900;text-align:center;min-height:1.5em}.spin{border:0;border-radius:22px;background:linear-gradient(#ff855d,#ed5c46);box-shadow:0 5px 0 #bb4336;color:#fff;font-weight:900;font-size:clamp(19px,5vw,26px);padding:16px 22px;width:min(94%,480px);touch-action:manipulation;cursor:pointer}.spin:disabled{opacity:.75}.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.controls button{border:2px solid #e9cba3;border-radius:999px;background:#fff9ed;color:#694a35;font-weight:700;font-size:14px;padding:10px 15px;cursor:pointer}.foot{font-size:12px;text-align:center;color:#97765e}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-30px;width:11px;height:16px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110dvh) rotate(900deg);opacity:0}}@media(max-height:650px){.app{justify-content:flex-start}.wheel-wrap{width:min(86vw,56dvh);height:min(86vw,56dvh)}.spin{padding:11px}.sub,.foot{display:none}}@media(orientation:landscape) and (max-height:550px){.app{display:grid;grid-template-columns: min(65vh,55vw) 1fr;grid-template-rows:auto auto auto auto;justify-items:center;align-content:center;gap:7px}.wheel-wrap{grid-column:1;grid-row:1/5;width:min(85vh,52vw);height:min(85vh,52vw)}h1,.sub,.result,.spin,.controls,.foot{grid-column:2}}
</style></head><body><main class="app"><h1>🍽️ Rulet za večeru</h1><p class="sub">Zavrti kotač i otkrij što ćemo papati!</p><div class="wheel-wrap"><div class="pointer"></div><svg id="wheel" class="wheel" viewBox="0 0 600 600" role="img" aria-label="Kotač s devet polja za tri jela"><circle cx="300" cy="300" r="296" fill="#e8a55c"/><g id="sectors"></g><circle cx="300" cy="300" r="48" fill="#fff8e8" stroke="#e8a55c" stroke-width="8"/><text x="300" y="314" font-size="44" text-anchor="middle">🍽️</text></svg></div><div id="result" class="result" aria-live="polite">✨ Što ćemo večerati? ✨</div><button class="spin" id="spin">🎡 ZAVRTI RULET!</button><div class="controls"><button id="sound">🔊 Zvuk uključen</button><button id="again">↻ Novi odabir</button></div><div class="foot">Svako jelo ima 3 polja • jednake šanse</div></main><div id="confetti" class="confetti"></div><script>
(()=>{'use strict';const ns='http://www.w3.org/2000/svg';const wheel=document.getElementById('wheel'),group=document.getElementById('sectors'),result=document.getElementById('result'),spin=document.getElementById('spin'),sound=document.getElementById('sound');const foods=[{name:'Keksi s mlijekom',lines:['KEKSI','S MLIJEKOM'],color:'#ffbc8d',kind:0},{name:'Čokolino',lines:['ČOKOLINO'],color:'#f8d878',kind:1},{name:'Gris na mlijeku',lines:['GRIS','NA MLIJEKU'],color:'#a7ded6',kind:2}];function svg(tag,attrs={},parent=group){let e=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}function shape(kind,x,y){const outer=svg('g',{transform:`translate(${x} ${y})`});if(kind===0){svg('rect',{x:-30,y:-7,width:22,height:38,rx:4,fill:'#fdfcff',stroke:'#87aaca','stroke-width':2},outer);svg('path',{d:'M-27 4h16v22h-16z',fill:'#fff'},outer);svg('ellipse',{cx:12,cy:12,rx:24,ry:22,fill:'#c88548',stroke:'#925d31','stroke-width':2},outer);[[-1,4],[16,-1],[24,14],[4,24],[14,18]].forEach(([a,b])=>svg('circle',{cx:a,cy:b,r:3.6,fill:'#67402c'},outer));}else{svg('ellipse',{cx:0,cy:24,rx:36,ry:12,fill:'#8cacc0',opacity:.35},outer);svg('path',{d:'M-35 4 Q-32 40 0 43 Q32 40 35 4Z',fill:kind===1?'#ef8b52':'#e5a6ad',stroke:'#fff','stroke-width':3},outer);svg('ellipse',{cx:0,cy:4,rx:35,ry:13,fill:kind===1?'#9c592d':'#f6e6c3',stroke:'#fff','stroke-width':3},outer);if(kind===2){for(let [a,b] of [[-16,2],[-3,-2],[14,5],[8,10],[-10,9]])svg('circle',{cx:a,cy:b,r:3,fill:'#87512f'},outer)}else{svg('path',{d:'M-21 4q10-8 18 0t19 0',stroke:'#d7a06c','stroke-width':4,fill:'none'},outer)}}}
for(let i=0;i<9;i++){const f=foods[i%3],a=(-90+i*40)*Math.PI/180,b=a+40*Math.PI/180,m=(a+b)/2;svg('path',{d:`M300 300 L${300+280*Math.cos(a)} ${300+280*Math.sin(a)} A280 280 0 0 1 ${300+280*Math.cos(b)} ${300+280*Math.sin(b)} Z`,fill:f.color,stroke:'#fff9eb','stroke-width':5});const x=300+186*Math.cos(m),y=300+186*Math.sin(m);shape(f.kind,x,y-29);f.lines.forEach((line,j)=>{const t=svg('text',{x,y:y+39+j*19,'text-anchor':'middle','font-size':16,'font-weight':900,fill:'#563e2c','paint-order':'stroke',stroke:f.color,'stroke-width':3});t.textContent=line})}
let angle=0,active=false,enabled=true,ctx=null,lastTick=0;function tone(freq,d=.045,vol=.055){if(!enabled||!ctx)return;try{let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}function celebrate(){const c=document.getElementById('confetti');c.replaceChildren();for(let i=0;i<40;i++){let p=document.createElement('div');p.className='piece';p.style.left=Math.random()*100+'%';p.style.background=['#ef7753','#e5bb45','#79c5be','#a68dd5'][i%4];p.style.animationDelay=Math.random()*.5+'s';p.style.setProperty('--drift',(Math.random()*200-100)+'px');c.appendChild(p)}setTimeout(()=>c.replaceChildren(),3000)}function run(){if(active)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}active=true;spin.disabled=true;spin.textContent='🎵 KOTAČ SE VRTI...';result.textContent='🌟 Napeto je! 🌟';const idx=Math.floor(Math.random()*9),current=((angle%360)+360)%360,target=(360-(idx*40+20))%360,from=angle,to=angle+2160+((target-current+360)%360),duration=5600;let start=null;lastTick=Math.floor(from/40);function frame(time){if(start===null)start=time;let t=Math.min(1,(time-start)/duration),v=from+(to-from)*(1-Math.pow(1-t,4));wheel.style.transform=`rotate(${v}deg)`;let tick=Math.floor(v/40);if(tick!==lastTick){tone(410+(tick%3)*60,.035,.04);lastTick=tick}if(t<1)requestAnimationFrame(frame);else{angle=to;active=false;spin.disabled=false;spin.textContent='🎡 ZAVRTI PONOVNO!';let f=foods[idx%3];result.textContent='🎉 '+f.name+'! 🎉';celebrate();tone(523,.2);setTimeout(()=>tone(659,.2),170);setTimeout(()=>tone(784,.38),350)}}requestAnimationFrame(frame)}spin.addEventListener('click',run);document.getElementById('again').addEventListener('click',run);sound.addEventListener('click',()=>{enabled=!enabled;sound.textContent=enabled?'🔊 Zvuk uključen':'🔇 Zvuk isključen'})})();
</script></body></html>
